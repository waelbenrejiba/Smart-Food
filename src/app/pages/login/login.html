
<div class="login-page">
  <main class="login-card">

    <a routerLink="/" class="brand">
      <div class="brand-logo">🌿</div>
      <div>
        <span class="brand-name">SmartFood</span>
        <span class="brand-city">HAMMAMET</span>
      </div>
    </a>

    <div class="login-heading">
      <h1>Bienvenue !</h1>
      <p>
        Connectez-vous à votre espace SmartFood.
      </p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          placeholder="Votre nom d'utilisateur"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
          required
        />
      </div>

      @if (message) {
        <div
          role="status"
          aria-live="polite"
          [class.message-success]="success"
          [class.message-error]="!success"
        >
          {{ message }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading"
      >
        {{ loading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>

    </form>

    <p class="register-link">
      Pas encore de compte ?
      <a routerLink="/user">Créer un compte</a>
    </p>

    <a routerLink="/" class="back-link">
      ← Retour à l'accueil
    </a>

  </main>
</div>
